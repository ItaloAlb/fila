[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fila"
version = "0.1.0"
description = "Queue and resource manager that joins non-local computers and Slurm clusters"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
fila = "fila.cli:entry"

[tool.setuptools.packages.find]
where = ["src"]
