#
# Full test suite on the oldest supported Python (3.9) and a current one on
# Linux, and on Windows, a first-class platform for nodes. fila has no
# dependencies, so there is nothing to cache. The README quick start runs
# verbatim on Linux.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: "3.9"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install .

      - name: Test
        run: python -m unittest discover -s tests -t .

      - name: Quick start
        if: runner.os == 'Linux'
        shell: bash
        env:
          FILA_HOME: ${{ runner.temp }}/fila-home
        run: |
          fila nodes register here --access local --shell "/bin/bash -lc" --jobs-dir ~/fila/jobs --cores 2 --mem 2G --speed 1
          fila server &
          fila submit --cores 1 --mem 100M --wait --timeout 2m -- echo hello
          fila log 1 | grep -x hello
